<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bot Kontrol Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #1f2532;
    --grid-line: #171b26;
    --text: #e6e8ef;
    --text-muted: #6b7280;
    --mint: #3ddc97;
    --amber: #f2a65a;
    --red: #ef5b5b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 36px;
  }

  .avatar {
    width: 56px; height: 56px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    object-fit: cover;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    letter-spacing: -0.01em;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .pulse-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.6);
    animation: pulse 1.8s infinite;
  }

  .pulse-dot.offline { background: var(--red); animation: none; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(61, 220, 151, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0); }
  }

  .ekg {
    flex: 1;
    height: 24px;
    overflow: hidden;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px;
  }

  .card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .card .value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--amber);
  }

  .card .value.mint { color: var(--mint); }

  section h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 500;
  }

  .terminal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .cmd-line {
    font-size: 13.5px;
    line-height: 2.1;
  }

  .cmd-line .prompt { color: var(--mint); }
  .cmd-line .name { color: var(--text); font-weight: 700; }
  .cmd-line .desc { color: var(--text-muted); }

  footer {
    margin-top: 40px;
    font-size: 11.5px;
    color: var(--text-muted);
    text-align: center;
  }

  .error-banner {
    background: rgba(239, 91, 91, 0.1);
    border: 1px solid rgba(239, 91, 91, 0.35);
    color: var(--red);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    margin-bottom: 24px;
    display: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="error-banner" id="errorBanner">
      ⚠ Bota su an ulasilamiyor. Botun calistigindan (npm start) emin ol.
    </div>

    <header>
      <img class="avatar" id="avatarImg" src="" alt="" />
      <div>
        <h1 id="botTag">Baglaniliyor...</h1>
        <div class="status-row">
          <span class="pulse-dot" id="statusDot"></span>
          <span id="statusText">durum kontrol ediliyor</span>
          <svg class="ekg" viewBox="0 0 300 24" preserveAspectRatio="none">
            <polyline points="0,12 40,12 48,4 56,20 64,12 120,12 128,3 136,21 144,12 300,12"
              fill="none" stroke="#3ddc97" stroke-width="1.5" opacity="0.5" />
          </svg>
        </div>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="label">Sunucu</div>
        <div class="value mint" id="statSunucu">–</div>
      </div>
      <div class="card">
        <div class="label">Kullanici</div>
        <div class="value" id="statKullanici">–</div>
      </div>
      <div class="card">
        <div class="label">Gecikme</div>
        <div class="value mint" id="statPing">–</div>
      </div>
      <div class="card">
        <div class="label">Calisma Suresi</div>
        <div class="value" id="statUptime">–</div>
      </div>
    </div>

    <section>
      <h2>// kayitli komutlar</h2>
      <div class="terminal" id="komutListesi">
        <div class="cmd-line"><span class="desc">yukleniyor...</span></div>
      </div>
    </section>

    <footer>reign-of-death-bot — dashboard 3 saniyede bir yenilenir</footer>
  </div>

<script>
  function saniyeyiFormatla(saniye) {
    const g = Math.floor(saniye / 86400);
    const s = Math.floor((saniye % 86400) / 3600);
    const d = Math.floor((saniye % 3600) / 60);
    const sn = saniye % 60;
    if (g > 0) return `${g}g ${s}s ${d}d`;
    if (s > 0) return `${s}s ${d}d ${sn}sn`;
    return `${d}d ${sn}sn`;
  }

  async function verileriGetir() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) throw new Error('istek basarisiz');
      const veri = await res.json();

      document.getElementById('errorBanner').style.display = 'none';
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('statusText').textContent = 'canli';

      document.getElementById('botTag').textContent = veri.botEtiketi;
      if (veri.avatarUrl) document.getElementById('avatarImg').src = veri.avatarUrl;

      document.getElementById('statSunucu').textContent = veri.sunucuSayisi;
      document.getElementById('statKullanici').textContent = veri.kullaniciSayisi;
      document.getElementById('statPing').textContent = veri.pingMs + 'ms';
      document.getElementById('statUptime').textContent = saniyeyiFormatla(veri.calismaSuresiSaniye);

      const liste = veri.komutlar
        .map(k => `<div class="cmd-line"><span class="prompt">$</span> <span class="name">/${k.isim}</span> <span class="desc">— ${k.aciklama}</span></div>`)
        .join('');
      document.getElementById('komutListesi').innerHTML = liste;
    } catch (err) {
      document.getElementById('errorBanner').style.display = 'block';
      document.getElementById('statusDot').classList.add('offline');
      document.getElementById('statusText').textContent = 'baglanti yok';
    }
  }

  verileriGetir();
  setInterval(verileriGetir, 3000);
</script>
</body>
</html>
